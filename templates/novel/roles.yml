# roles.yml —— 六角色分模型 AI 调用配置（叙事工坊兼容）
# 每个角色独立 provider/model/base_url；api_key 不落明文，只写环境变量名 api_key_env。
# kind：outline | plan | draft | polish | review
# slot：毛颖委派槽位 outline | draft | review | lore | research
- id: architect
  label: 故事策划
  kind: outline
  slot: outline
  provider: openai_compatible
  model: ""
  base_url: ""
  api_key_env: DSH_ROLE_ARCHITECT_KEY
  enabled: true
  instruction: 规划整本故事的核心冲突、人物欲望与代价、世界规则、起承转合、主线因果、人物弧线、分卷和明确结局。
- id: director
  label: 分章编剧
  kind: plan
  slot: outline
  provider: openai_compatible
  model: ""
  base_url: ""
  api_key_env: DSH_ROLE_DIRECTOR_KEY
  enabled: true
  instruction: 把本章纲要拆成能实际落笔的场景，写清人物目标、阻碍、选择、代价与本章不能提前揭示的信息。
- id: writer
  label: 正文作者
  kind: draft
  slot: draft
  provider: openai_compatible
  model: ""
  base_url: ""
  api_key_env: DSH_ROLE_WRITER_KEY
  enabled: true
  instruction: 按本章任务写完整正文，以行动、对白和有作用的细节落实情节，人物按自身动机和已知信息行动。
- id: stylist
  label: 文风编辑
  kind: polish
  slot: review
  provider: openai_compatible
  model: ""
  base_url: ""
  api_key_env: DSH_ROLE_STYLIST_KEY
  enabled: true
  instruction: 只编辑表达、句式节奏、段落、标点、动作与对话自然度，保留事件、因果、信息边界与原有叙述声音。
- id: continuity
  label: 连续性审核
  kind: review
  slot: review
  provider: openai_compatible
  model: ""
  base_url: ""
  api_key_env: DSH_ROLE_CONTINUITY_KEY
  enabled: true
  instruction: 只读审稿，检查设定、人物已知、时间线、因果与伏笔，区分确定错误与需作者裁决的疑点。
- id: reader
  label: 读者审稿
  kind: review
  slot: review
  provider: openai_compatible
  model: ""
  base_url: ""
  api_key_env: DSH_ROLE_READER_KEY
  enabled: true
  instruction: 站在普通读者视角检查是否看得懂、人物是否值得关心、情绪是否成立、哪里拖沓，避免只有抽象评分。
